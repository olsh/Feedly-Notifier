name: "Automerge"
on:
    push:
        branches: ["master"]
    pull_request:

permissions: {}

jobs:
    test:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            # No step here pushes or fetches, so the job has no use for a
            # persisted token in .git/config.
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: "22.x"
                  cache: "npm"

            - run: npm install
            - run: npm run lint
            - run: npm test

            # One build proves the copy/preprocess/zip pipeline runs. Building each
            # browser in turn adds nothing: the only per-browser failure mode is an
            # unbalanced @if/@endif, and `preprocess` scans every directive whatever
            # BROWSER it is resolving, so it throws for all three alike. firefox rather
            # than chrome because the e2e job already builds chrome -- and through the
            # `default` task, so it never zips. What each target actually resolves to is
            # validated in test/preprocess.test.js.
            #
            # Dummy credentials, like the e2e build: string-replace substitutes
            # whatever it is handed, so the real secrets would prove nothing here,
            # and this way the job also runs on pull requests from forks. The
            # locally installed grunt rather than `npx`, which would be free to
            # fetch an unpinned package on demand and run its lifecycle scripts.
            - run: ./node_modules/.bin/grunt build --clientId=ci-client-id --clientSecret=ci-client-secret --browser=firefox

            # The zip the previous step just produced is the artifact that goes to
            # addons.mozilla.org, where this same linter gates the submission -- so a
            # manifest AMO would reject fails the pull request instead of the release.
            # The archive rather than the unpacked build, because its layout is part of
            # what gets validated. This is also why the build above is the firefox one.
            #
            # addons-linter exits non-zero on errors only, which is what we want:
            # warnings remain for the sidePanel calls core.js guards on
            # `browser.sidePanel` at runtime, and there is no per-rule suppression, so
            # --warnings-as-errors would fail forever. The locally installed binary
            # rather than `npx`, for the same reason as grunt above.
            - run: ./node_modules/.bin/addons-linter build/feedly-notifier-firefox.zip

    # Kept separate from `test`: this job needs a Playwright browser download and
    # different builds, and it is worth seeing which of the two failed. The builds
    # use dummy credentials rather than the repository secrets, because the
    # suite never exercises the real OAuth flow -- which also lets it run on
    # pull requests from forks.
    e2e:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            # No step here pushes or fetches, so the job has no use for a
            # persisted token in .git/config.
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: "22.x"
                  cache: "npm"

            # `npm ci --ignore-scripts` for a reproducible install that runs no
            # dependency lifecycle scripts, and the locally installed Playwright
            # binary rather than `npx`, which would be free to fetch an unpinned
            # package on demand. Browsers are installed by the next step, so
            # nothing here depends on a postinstall hook.
            - run: npm ci --ignore-scripts

            # Only chromium is downloaded. The firefox project drives the firefox and
            # geckodriver the runner image already ships, which e2e/fixtures/
            # firefox-driver.js prefers through $GECKOWEBDRIVER so selenium-manager
            # never has to fetch one. Printing the versions makes image drift show up
            # in the log rather than as a mystery failure.
            - run: ./node_modules/.bin/playwright install --with-deps chromium
            - run: firefox --version && "$GECKOWEBDRIVER/geckodriver" --version

            # Builds and runs both projects: chromium into build/, firefox into
            # build-firefox/.
            - run: npm run build:e2e
            - run: npm run test:e2e

            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    automerge:
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest

        permissions:
            pull-requests: write
            contents: write

        steps:
            - id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
              run: gh pr merge --auto --squash "$PR_URL"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
